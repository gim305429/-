<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바람의 초원 원정대 — 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(14, 26, 34, .78); --glass2: rgba(24, 42, 52, .86); --line: rgba(232, 222, 196, .35); --line2: rgba(232, 222, 196, .7);
    --txt: #f2ead6; --dim: #a9b4ad; --gold: #e9c46a; --teal: #6fe3d0; --red: #ef6b5b; --green: #8fdc6e; --blue: #79b8ff;
    --warrior: #e07a4f; --cleric: #f2d27a; --mage: #a98bf0; --archer: #7fcf7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a22; font-family: 'Gowun Dodum', system-ui, sans-serif; color: var(--txt); user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  h1, h2, h3, .jua { font-family: 'Jua'; font-weight: normal; letter-spacing: .5px; }
  h2 { margin: 2px 0 12px; font-size: 26px; color: var(--gold); } h3 { margin: 16px 0 8px; font-size: 18px; color: var(--txt); }
  .note { color: var(--dim); font-size: 14px; line-height: 1.5; }
  kbd { display: inline-block; min-width: 20px; padding: 0 5px; margin-right: 4px; border: 1px solid var(--line2); border-radius: 5px; font: 12px/18px 'Jua'; text-align: center; color: var(--gold); }

  /* 버튼: 얇은 테두리 + 금색 강조 */
  button { font: inherit; color: var(--txt); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
  button:hover:not(:disabled) { background: rgba(233, 196, 106, .14); border-color: var(--gold); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: linear-gradient(#f0d07e, #d9a943); color: #23180a; border-color: #fff3c8; font-family: 'Jua'; }
  button.primary:hover:not(:disabled) { background: linear-gradient(#ffe39a, #e6b94f); }
  button.big { font-size: 21px; padding: 12px 30px; }
  button.small { font-size: 13px; padding: 5px 10px; border-radius: 8px; }
  button.danger { margin-top: 22px; border-color: rgba(239, 107, 91, .6); color: #ffb3a8; }
  input, select { font: inherit; color: var(--txt); background: rgba(0, 0, 0, .3); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=range] { padding: 0; accent-color: var(--gold); } input[type=checkbox] { accent-color: var(--gold); width: 18px; height: 18px; }
  .bar { height: 7px; background: rgba(0, 0, 0, .45); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; } .bar.xp i { background: var(--gold); } .bar.hp i { background: var(--green); }

  /* 직업 문장 */
  .emblem { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 16px; color: #14202a; background: var(--c); box-shadow: 0 0 0 2px rgba(0, 0, 0, .35), 0 0 0 3px var(--c); }
  .emblem.big { width: 46px; height: 46px; font-size: 24px; } .emblem.sm { width: 22px; height: 22px; font-size: 12px; }
  .emblem.warrior { --c: var(--warrior); } .emblem.cleric { --c: var(--cleric); } .emblem.mage { --c: var(--mage); } .emblem.archer { --c: var(--archer); }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .panel { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px; width: 100%; max-height: 94vh; overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
  .panel::-webkit-scrollbar { width: 8px; } .panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }

  /* ===== 마을: 왼쪽 메뉴 + 오른쪽 내용, 뒤로 3D 마을이 보인다 ===== */
  #town { justify-content: flex-start; align-items: stretch; padding: 0; background: linear-gradient(90deg, rgba(10, 20, 26, .82) 0, rgba(10, 20, 26, .55) 46%, rgba(10, 20, 26, .1) 100%); }
  #town-side { width: 230px; flex: none; padding: 26px 18px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line); background: rgba(8, 16, 22, .55); }
  #town-side h1 { margin: 0; font-size: 25px; line-height: 1.15; color: var(--gold); text-shadow: 0 2px 12px rgba(233, 196, 106, .25); }
  #town-side .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  #town-nav { display: flex; flex-direction: column; gap: 4px; }
  #town-nav button { position: relative; text-align: left; border: none; border-left: 3px solid transparent; border-radius: 0 8px 8px 0; background: none; font-family: 'Jua'; font-size: 17px; padding: 10px 14px; }
  #town-nav button.on { border-left-color: var(--gold); background: rgba(233, 196, 106, .14); color: var(--gold); }
  #nav-pts { position: absolute; right: 10px; top: 9px; background: var(--red); color: #fff; border-radius: 99px; font-size: 12px; padding: 1px 7px; }
  .whoami { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; font-size: 14px; }
  .whoami div { display: flex; justify-content: space-between; margin: 4px 0; } .whoami b { color: var(--gold); font-family: 'Jua'; font-weight: normal; }
  #town-main { flex: 1; overflow: auto; padding: 28px 30px; max-width: 900px; }
  #town-main::-webkit-scrollbar { width: 8px; } #town-main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }
  .classgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .classcard { text-align: left; padding: 14px; border-radius: 14px; background: var(--glass2); display: flex; flex-direction: column; gap: 8px; }
  .classcard.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 24px rgba(233, 196, 106, .18); }
  .ctop { display: flex; align-items: center; gap: 12px; } .cname { font-family: 'Jua'; font-size: 22px; } .crole { color: var(--dim); font-size: 13px; }
  .clv { margin-left: auto; font-family: 'Jua'; color: var(--gold); font-size: 18px; }
  .cskills { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--dim); }
  .cpts { color: var(--red); font-size: 13px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .mode { background: var(--glass2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .mode h3 { margin: 0; color: var(--gold); } .mode p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.5; }
  .bots { display: flex; align-items: center; gap: 10px; font-size: 14px; } .bots input { flex: 1; }
  .joinrow { display: flex; gap: 8px; } .joinrow input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 4px; font-family: 'Jua'; font-size: 18px; text-align: center; }
  .lobbystatus { color: var(--teal); font-size: 13px; min-height: 18px; }
  .tfoot { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .stats { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; }
  .ptsleft { font-family: 'Jua'; font-size: 18px; } .ptsleft b { color: var(--gold); font-size: 24px; font-weight: normal; }
  .statrow { display: grid; grid-template-columns: 170px 1fr 34px 40px; align-items: center; gap: 4px 12px; background: var(--glass2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .sname { font-family: 'Jua'; font-size: 17px; } .sname small { display: block; font-family: 'Gowun Dodum'; font-size: 12px; color: var(--dim); }
  .sbar { position: relative; height: 9px; background: rgba(0, 0, 0, .45); border-radius: 99px; }
  .sbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 99px; }
  .sbar em { position: absolute; top: -3px; width: 2px; height: 15px; background: var(--line2); margin-left: -1px; }
  .sval { font-family: 'Jua'; font-size: 20px; text-align: right; color: var(--gold); }
  .plus { width: 36px; height: 36px; padding: 0; font-size: 20px; font-family: 'Jua'; border-radius: 50%; }
  .traits { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .traits span { border: 1px dashed var(--line); border-radius: 8px; padding: 3px 8px; color: var(--dim); }
  .traits span.on { border: 1px solid var(--gold); color: var(--gold); background: rgba(233, 196, 106, .1); } .traits b { font-family: 'Jua'; font-weight: normal; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { display: flex; flex-direction: column; gap: 6px; } .slabel { font-size: 12px; color: var(--dim); }
  .itemlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .itemlist > .note { grid-column: 1 / -1; }
  .itemlist.narrow { grid-template-columns: 1fr; max-height: 60vh; overflow: auto; padding-right: 6px; }
  .iwrap { display: flex; flex-direction: column; gap: 6px; } .iwrap.pick { cursor: pointer; } .iwrap.pick.on .item { box-shadow: 0 0 0 2px var(--gold); }
  .item { position: relative; background: linear-gradient(135deg, color-mix(in srgb, var(--rc) 22%, transparent), rgba(0, 0, 0, .25) 60%); border: 1px solid color-mix(in srgb, var(--rc) 70%, transparent); border-radius: 12px; padding: 9px 12px; font-size: 13px; }
  .item.empty { --rc: #556; color: var(--dim); }
  .iname { font-family: 'Jua'; font-size: 16px; color: var(--rc); } .iname b { color: var(--gold); font-weight: normal; }
  .islot { color: var(--dim); font-size: 12px; } .istats { margin-top: 5px; line-height: 1.55; }
  .iuniq { margin-top: 5px; color: var(--gold); } .where { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .smith { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .smithpanel { display: flex; flex-direction: column; gap: 8px; }
  .settings label { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .bosspick { max-width: 320px; }

  /* ===== 로비 ===== */
  #lobby { background: rgba(8, 16, 22, .55); } #lobby .panel { max-width: 560px; }
  .lhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .code { font-family: 'Jua'; font-size: 48px; letter-spacing: 10px; color: var(--gold); line-height: 1; }
  .linktext { word-break: break-all; margin: 8px 0 14px; font-size: 12px; }
  .lslots { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .lslot { display: flex; align-items: center; gap: 12px; background: var(--glass2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .lslot.empty { border-style: dashed; color: var(--dim); justify-content: center; }
  .tag { font-size: 11px; color: #23180a; background: var(--gold); border-radius: 6px; padding: 1px 6px; }
  .lpick { margin: 4px 0 12px; } .lclasses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .lclasses button { display: flex; align-items: center; gap: 6px; padding: 7px 8px; font-size: 14px; } .lclasses button small { color: var(--dim); margin-left: auto; }
  .lclasses button.on { border-color: var(--gold); color: var(--gold); background: rgba(233, 196, 106, .14); }
  #lobby .bots { margin-bottom: 10px; }
  .lbtns { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 8px; }

  /* ===== 카드: 게임은 멈추지 않는다 ===== */
  #cards { background: radial-gradient(ellipse at center, rgba(8, 16, 22, .55), rgba(8, 16, 22, .2)); flex-direction: column; gap: 14px; }
  #cards-title { color: var(--gold); font-size: 28px; text-shadow: 0 2px 10px #000; margin: 0; }
  #cards-timer { position: relative; width: min(420px, 80vw); height: 8px; background: rgba(0, 0, 0, .5); border-radius: 99px; }
  #cards-timer i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .1s linear; }
  #cards-timer b { position: absolute; right: -34px; top: -8px; font: 18px 'Jua'; color: var(--gold); font-weight: normal; }
  #cards-timer.low i { background: var(--red); } #cards-timer.low b { color: var(--red); }
  #waitcards { position: absolute; left: 50%; top: 34%; transform: translateX(-50%); background: var(--glass); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 18px; font-family: 'Jua'; font-size: 17px; color: var(--gold); }
  #cards-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .card { position: relative; width: 210px; min-height: 280px; padding: 16px; border-radius: 16px; border: 1px solid var(--tc); background: linear-gradient(170deg, color-mix(in srgb, var(--tc) 25%, #142430), #0f1c24 70%); text-align: left; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .4); animation: cin .25s backwards; }
  .card:nth-child(2) { animation-delay: .05s; } .card:nth-child(3) { animation-delay: .1s; }
  @keyframes cin { from { transform: translateY(20px); opacity: 0; } }
  .card:hover { transform: translateY(-6px); box-shadow: 0 0 0 1px var(--tc), 0 0 30px color-mix(in srgb, var(--tc) 50%, transparent); }
  .card.legend { background: linear-gradient(170deg, #5a4520, #1a1810 70%); }
  .chead { display: flex; justify-content: space-between; align-items: center; }
  .ctier { font-family: 'Jua'; font-size: 13px; color: #10161a; border-radius: 6px; padding: 1px 8px; }
  .ckey { font-family: 'Jua'; font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
  .cicon { font-size: 34px; text-align: center; margin: 6px 0 2px; color: var(--tc); text-shadow: 0 0 16px var(--tc); }
  .ctitle { font-family: 'Jua'; font-size: 21px; text-align: center; } .cfam { font-size: 12px; color: var(--dim); text-align: center; }
  .cdesc { font-size: 14px; line-height: 1.55; margin-top: 4px; }
  .upg { margin-top: auto; font-size: 12px; color: var(--gold); border-top: 1px solid var(--line); padding-top: 6px; }
  body.touch .ckey { display: none; }

  /* ===== 결과·가방·일시정지·지도 ===== */
  #result { background: rgba(8, 16, 22, .6); } #result .panel { max-width: 900px; } #result .panel > button { display: block; margin: 16px auto 0; }
  .rsum { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-bottom: 8px; }
  #bag .panel { max-width: 900px; } .bagtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #bag-tabs { display: flex; gap: 4px; } #bag-tabs button { font-family: 'Jua'; } #bag-tabs button.on { border-color: var(--gold); color: var(--gold); background: rgba(233, 196, 106, .12); }
  #bag-body { margin-top: 12px; }
  .bagcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .mini { border-left: 3px solid var(--tc); background: var(--glass2); border-radius: 8px; padding: 7px 10px; } .mini small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  #pause .panel { max-width: 380px; text-align: center; } #pause .panel button { display: block; width: 100%; margin-top: 10px; }
  #bigmap { background: rgba(8, 16, 22, .7); flex-direction: column; gap: 8px; }
  #bigmap canvas { width: min(86vh, 92vw); height: min(86vh, 92vw); }

  /* ===== HUD ===== */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
  .hide-on-aim { transition: opacity .15s; }
  #hud.aiming .hide-on-aim, #touch.aiming .hide-on-aim:not(.held) { opacity: 0; }
  #compass { position: absolute; top: 10px; left: 50%; width: 520px; max-width: 60vw; height: 34px; transform: translateX(-50%); overflow: hidden;
    -webkit-mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
  #compass::before { content: ''; position: absolute; left: 0; right: 0; top: 16px; height: 1px; background: var(--line2); }
  #compass::after { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 10px; margin-left: -1px; background: var(--gold); }
  #compass .strip { position: absolute; inset: 0; }
  #compass .dir, #compass .mk { position: absolute; top: 9px; transform: translateX(-50%); font-family: 'Jua'; font-size: 15px; }
  #compass .dir { color: var(--txt); } #compass .mk { top: 10px; display: flex; flex-direction: column; align-items: center; }
  #compass .mk i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0d1820; } #compass .mk i.ally { background: #5ad1ff; }
  #compass .mk small { font-family: 'Gowun Dodum'; font-size: 10px; color: var(--dim); }
  #objbox { position: absolute; top: 14px; left: 16px; max-width: 34vw; }
  #region { font-family: 'Jua'; font-size: 20px; color: var(--gold); }
  #objective { font-size: 14px; margin-top: 2px; } #objective b { color: var(--teal); font-weight: normal; font-family: 'Jua'; }
  #danger { display: inline-block; margin-top: 4px; font-family: 'Jua'; font-size: 13px; color: #ffb3a8; border: 1px solid rgba(239, 107, 91, .5); border-radius: 6px; padding: 0 6px; }
  #party { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .pf { display: flex; align-items: center; gap: 8px; width: 190px; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; }
  .pfb { flex: 1; min-width: 0; } .pfn { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pfn small { color: var(--dim); }
  .pf .bar { height: 5px; margin-top: 3px; } .pf em { font-style: normal; font-size: 11px; color: var(--red); }
  .pf.down { border-color: var(--red); animation: pulse 1s infinite; } .pf.dead { opacity: .5; }
  #mapwrap { position: absolute; top: 12px; right: 14px; width: 168px; height: 168px; }
  #minimap { width: 168px; height: 168px; border-radius: 50%; box-shadow: 0 0 0 2px var(--line2), 0 0 0 5px rgba(0, 0, 0, .35); }
  #mapwrap .mhint { position: absolute; bottom: -18px; width: 100%; text-align: center; font-size: 11px; color: var(--dim); }
  #toasts { position: absolute; right: 14px; top: 206px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .toast { background: var(--glass); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 8px; padding: 6px 12px; font-size: 14px; animation: tin .2s; }
  @keyframes tin { from { transform: translateX(20px); opacity: 0; } }
  #cardicons { position: absolute; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 26vw; }
  #cardicons span { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--tc); background: var(--glass); color: var(--tc); font: 11px/26px 'Jua'; text-align: center; }
  #bossbar { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: min(560px, 64vw); text-align: center; }
  #bossname { font-family: 'Jua'; font-size: 19px; color: #ffd6e2; }
  .bossbg { height: 10px; margin-top: 4px; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 180, 200, .6); border-radius: 2px; overflow: hidden; }
  #bossfill { height: 100%; background: linear-gradient(90deg, #ff7aa0, #ffb37a); transition: width .15s; }
  .bottom { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 16px; }
  .vitals { width: min(360px, 44vw); }
  .vtop { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 13px; }
  #myname { font-family: 'Jua'; font-size: 15px; } .lv { font-family: 'Jua'; color: var(--gold); }
  #ptsbadge { margin-left: auto; font-family: 'Jua'; font-size: 12px; color: #23180a; background: var(--gold); border-radius: 6px; padding: 1px 7px; animation: pulse 1.4s infinite; }
  .hpbar { position: relative; height: 16px; background: rgba(0, 0, 0, .55); border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; transform: skewX(-12deg); }
  #hpfill { height: 100%; background: linear-gradient(#a8ec86, #5fb04f); transition: width .1s; }
  #hptext { position: absolute; inset: 0; transform: skewX(12deg); text-align: center; font: 12px/15px 'Jua'; }
  #manabar { height: 5px; margin-top: 3px; background: rgba(0, 0, 0, .5); transform: skewX(-12deg); } #manafill { height: 100%; background: var(--blue); }
  .xpline { height: 3px; margin-top: 4px; background: rgba(0, 0, 0, .5); } #xpfill { height: 100%; background: var(--gold); }
  .skills { display: flex; gap: 8px; }
  .cdbox { position: relative; width: 56px; height: 56px; border-radius: 12px; border: 1px solid var(--line2); background: var(--glass); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; text-align: center; line-height: 1.15; overflow: hidden; }
  .cdbox b { font: 15px 'Jua'; color: var(--gold); }
  .cdbox::after { content: ''; position: absolute; inset: 0; background: conic-gradient(rgba(0, 0, 0, .65) calc(var(--cd, 0) * 360deg), transparent 0); }
  body.touch .bottom .skills, body.touch #mapwrap .mhint { display: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }

  #sporeblur { position: absolute; inset: 0; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); background: rgba(150, 200, 80, .18); opacity: 0; transition: opacity .3s; } #sporeblur.on { opacity: 1; }

  /* ===== 모바일 조작 ===== */

  .tbtn[data-k=aux] { width: 64px; height: 64px; right: calc(max(24px, env(safe-area-inset-right)) + 18px); bottom: 140px; }
  .tbtn[data-k=skill] { width: 64px; height: 64px; right: calc(max(24px, env(safe-area-inset-right)) + 112px); bottom: 34px; }
  .tbtn[data-k=dash] { width: 54px; height: 54px; right: calc(max(24px, env(safe-area-inset-right)) + 104px); bottom: 118px; }

  .tbtn[data-k=pause] { width: 44px; height: 44px; border-radius: 10px; right: 196px; top: 112px; }
  body.touch #prompt { top: 54%; }
  #rotate { display: none; position: fixed; inset: 0; background: #0e1a22; z-index: 50; align-items: center; justify-content: center; font-family: 'Jua'; font-size: 24px; text-align: center; padding: 20px; }
